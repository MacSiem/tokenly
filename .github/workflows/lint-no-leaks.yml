name: lint-no-leaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  blocklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse known-secret patterns
        run: |
          set -eu
          # Each entry below is a literal string that must NEVER appear in this
          # repository: real Tokenly internal identifiers and key-file headers.
          literals=(
            "claude_ai_session_cookie"
            "openai_admin_api_key"
            "openai_api_key"
            "anthropic_admin_api_key"
            "openrouter_api_key"
            "chatgpt_access_token"
            "chatgpt_account_id"
            "usagedeck_syncd_secret"
            "AuthKey_CUB63D2YN8"
            "CUB63D2YN8"
            "tokenly-android-release.jks"
            "8761f9b5-74b5-4fc6-b8c0-3a7022bc0243"
            "BEGIN PRIVATE KEY"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN OPENSSH PRIVATE KEY"
            "-----BEGIN CERTIFICATE-----"
          )

          # Credential prefixes. A bare prefix is not a leak — this is a
          # transparency repo, and its docs legitimately name the prefixes when
          # describing which header goes to which provider ("sk-ant-admin-…").
          # Only a prefix carrying real key material counts, so each pattern
          # requires a plausible secret body after it.
          credential_regexes=(
            "sk-ant-admin-[A-Za-z0-9_-]{16,}"
            "sk-or-v1-[A-Za-z0-9_-]{16,}"
            "gh[pousr]_[A-Za-z0-9]{16,}"
          )

          hits=0
          for needle in "${literals[@]}"; do
            if grep -RIn --exclude-dir=.git --exclude=lint-no-leaks.yml -- "$needle" .; then
              echo "::error::blocked string '$needle' is present in the public transparency repo"
              hits=$((hits+1))
            fi
          done

          for pattern in "${credential_regexes[@]}"; do
            if grep -REIn --exclude-dir=.git --exclude=lint-no-leaks.yml -- "$pattern" .; then
              echo "::error::credential matching '$pattern' is present in the public transparency repo"
              hits=$((hits+1))
            fi
          done

          if [ "$hits" -gt 0 ]; then
            echo "::error::Refusing to merge: $hits blocked strings present."
            exit 1
          fi
          echo "ok: no blocklisted strings present"
